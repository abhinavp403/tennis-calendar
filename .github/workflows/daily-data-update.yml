name: Daily Data Update

# Fetches tournament results and rankings from Wikipedia, resolves players'
# full first names, then pushes updated tournaments.json to the Gist that the
# app reads at launch.
#
# Runs twice a day. fetchResults only picks up a tournament once its end date
# has passed in UTC, so the 01:00 run is what catches the previous day's finals
# (most finals are Sun) within hours; 09:00 is the catch-up pass for anything
# Wikipedia hadn't published yet.

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bootstrap data/ from Gist if missing
        run: |
          mkdir -p data
          BASE="https://gist.githubusercontent.com/abhinavp403/c75d3f961da94fdeed16cdbd8e2ec08e/raw"
          for f in tournaments.json rankings.json; do
            if [ ! -f "data/$f" ]; then
              echo "Fetching data/$f from Gist..."
              curl -fsSL "$BASE/$f" -o "data/$f"
            fi
          done
          # Sanity-check that we got valid JSON
          node -e "JSON.parse(require('fs').readFileSync('data/tournaments.json'))"
          node -e "JSON.parse(require('fs').readFileSync('data/rankings.json'))"

      - name: Fix tournament dates
        run: node scripts/fixDates.js
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Fetch missing results
        run: node scripts/fetchResults.js
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Resolve players' full names and countries
        run: node scripts/enrichPlayers.js
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Fetch missing rankings
        run: node scripts/fetchRankings.js
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
