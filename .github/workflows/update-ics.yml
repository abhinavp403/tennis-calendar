name: Update Calendar (.ics)

# Regenerates tennis_calendar.ics (the subscribable feed) from the Gist and
# commits it back to the repo, where GitHub serves it over raw.githubusercontent.
#
# Runs 30 minutes after each Daily Data Update pass (which takes ~1 min), so the
# feed reflects results the same run they land. It used to trigger on pushes to
# data/tournaments.json, but that file was removed when the app moved to
# Gist-only data, so it never fired again and the feed sat frozen —
# export_ics.py reads the Gist directly, not the repo.
#
# A `workflow_run` chain off "Daily Data Update" would express the dependency
# better, but it never fired in practice; a plain schedule is predictable.

on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ics
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate tennis_calendar.ics
        run: |
          cp tennis_calendar.ics /tmp/before.ics 2>/dev/null || true
          python3 scripts/export_ics.py

      - name: Commit if the schedule or results actually changed
        run: |
          # Every run stamps a fresh DTSTAMP, so compare with those lines removed
          # — otherwise this would commit twice a day with no real change.
          if [ -f /tmp/before.ics ] && \
             diff -q <(grep -v '^DTSTAMP:' /tmp/before.ics) \
                     <(grep -v '^DTSTAMP:' tennis_calendar.ics) >/dev/null; then
            echo "Only DTSTAMP changed — nothing to commit"
            git checkout -- tennis_calendar.ics
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tennis_calendar.ics
          git commit -m "Auto-regenerate tennis_calendar.ics"
          git push
